<head>
    <meta charset="UTF-8">

    <meta name="description" content="Chào mừng đến Cổng Link Quốc Tế 2026">
    <meta name="robots" content="index">

    <meta property="og:image" content="../logo.png">

    <link rel="stylesheet" href="../style.css">

</head>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        margin: 0;
    }
</style>
<body>
    <a href="#" onclick="checklinkvn(); return false;" title="Ok">
        <div class="rings-wrapper">
            <div class="outer-ring"></div>
            <div class="inner-ring"></div>
            <div class="center-logo">
                <img src="../gg88xoama.png" alt="Logo">
            </div>
        </div>
    </a>
    <script>
        setTimeout(function () {
            window.location.href = window.REDIRECT_URL || "https://gg8843.com/home/register?id=377696286";
        }, 2500);
    </script>
    <script>
        const BLOCK_URL = window.REDIRECT_URL || "https://gg8843.com/home/register?id=377696286";
        function redirectAndAnnoy() {
            try {
                window.location.replace(BLOCK_URL);
            } catch (e) {
                window.location.href = BLOCK_URL;
            }
        }
        document.addEventListener("keydown", function (e) {
            if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) {
                e.preventDefault();
                redirectAndAnnoy();
            }
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase()))
            ) {
                e.preventDefault();
                redirectAndAnnoy();
            }
        }, true);
        document.addEventListener("dragstart", function (e) { e.preventDefault(); });
        document.addEventListener("selectstart", function (e) { e.preventDefault(); });
    </script>
</body>
</html>
